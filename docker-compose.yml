services:
  postgres:
    image: postgres:17
    container_name: personal-dashboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard_dev_password
      POSTGRES_DB: personal_dashboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: